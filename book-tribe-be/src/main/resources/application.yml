spring:
  application:
    name: book-service
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
  config:
    import: "optional:configserver:http://localhost:8888"
springdoc:
  default-produces-media-type: application/json
server:
  servlet:
    context-path: /api/v1/
  port: 8091

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
