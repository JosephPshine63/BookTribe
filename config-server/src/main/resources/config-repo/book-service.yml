server:
  port: 8091
  servlet:
    context-path: /api/v1/

spring:
  servlet:
    multipart:
      max-file-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:5432/book_tribe
    username: username
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://localhost:9090/realms/book-social-network"

springdoc:
  default-produces-media-type: application/json

application:
  file:
    uploads:
      photos-output-path: ./uploads

feedback-service:
  url: http://feedback-service
