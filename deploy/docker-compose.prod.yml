name: booktribe

x-spring-service: &spring-service
  restart: unless-stopped
  networks: [booktribe]
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/$$SERVER_PORT"]
    interval: 10s
    timeout: 3s
    retries: 30
    start_period: 30s

x-spring-env: &spring-env
  SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
  EUREKA_URL: http://discovery-server:8761/eureka/
  DB_HOST: postgres
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  KEYCLOAK_ISSUER_URI: https://${PUBLIC_HOST}:8443/realms/book-social-network
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/book-social-network/protocol/openid-connect/certs

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [booktribe]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Public URL served by Tailscale Funnel; tokens are issued with this issuer.
      KC_HOSTNAME_URL: https://${PUBLIC_HOST}:8443
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      # TLS is terminated by Tailscale Funnel.
      KC_HTTP_ENABLED: "true"
      # Substituted into the realm export on import (bsn client redirect URIs / web origins).
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - ../keycloak/realm/book-social-network:/opt/keycloak/data/import/book-social-network.json:ro
    ports:
      - "127.0.0.1:9090:8080"
    networks: [booktribe]
    depends_on:
      postgres:
        condition: service_healthy

  config-server:
    <<: *spring-service
    build: ../config-server
    environment:
      SERVER_PORT: 8888

  discovery-server:
    <<: *spring-service
    build: ../discovery-server
    environment:
      SERVER_PORT: 8761

  book-service:
    <<: *spring-service
    build: ../book-tribe-be
    environment:
      <<: *spring-env
      SERVER_PORT: 8091
      UPLOADS_PATH: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  feedback-service:
    <<: *spring-service
    build: ../feedback-service
    environment:
      <<: *spring-env
      SERVER_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  gateway:
    <<: *spring-service
    build: ../gateway
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      EUREKA_URL: http://discovery-server:8761/eureka/
      SERVER_PORT: 8088
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL},http://localhost:4200
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

networks:
  booktribe:

volumes:
  postgres-data:
  uploads:
